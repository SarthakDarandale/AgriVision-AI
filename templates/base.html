<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}AgriVision AI{% endblock %}</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

    <!-- Google Font -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
        rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-light shadow">

        <div class="container-fluid">

            <a class="navbar-brand fw-bold" href="/">
                🌾 AgriVision AI
            </a>

            <button class="navbar-toggler"
                type="button"
                data-bs-toggle="collapse"
                data-bs-target="#navbarNav">

                <span class="navbar-toggler-icon"></span>

            </button>

            <div class="collapse navbar-collapse" id="navbarNav">

                <ul class="navbar-nav ms-auto">

                    <li class="nav-item">
                        <a class="nav-link" href="/">🏠 Home</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/predict-page">🌾 Prediction</a>
                    </li>
                    <li class="nav-item">
    <a class="nav-link" href="/weather">
        🌦 Weather
    </a>
</li>

                    <li class="nav-item">
                        <a class="nav-link" href="/history">📊 History</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/about">ℹ About</a>
                    </li>

                    <li class="nav-item">
                        <a class="nav-link" href="/contact">📞 Contact</a>
                    </li>

                </ul>

            </div>

        </div>

    </nav>
    <li class="nav-item">
    <a class="nav-link" href="/maharashtra-crops">
        🌾 Maharashtra Crops
    </a>
</li>

    <!-- Main Content -->
    <main class="container-fluid py-4">

        {% block content %}
        {% endblock %}

    </main>

    <!-- Footer -->
    <footer class="bg-dark text-white text-center p-3 mt-5">

        <p class="mb-1">
            © 2026 AgriVision AI | Smart Agriculture Assistant
        </p>

        <small>
            Developed for Diploma Final Year Project
        </small>

    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>

</html>
